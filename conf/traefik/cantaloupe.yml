http:
  middlewares:
    cantaloupe-strip-prefix:
      stripPrefix:
        prefixes:
          - /cantaloupe
    cantaloupe-custom-request-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Path: /cantaloupe
    cantaloupe:
      chain:
        middlewares:
          - cantaloupe-strip-prefix
          - cantaloupe-custom-request-headers

  services:
    cantaloupe:
      loadBalancer:
        servers:
          - url: http://cantaloupe:8182
  routers:
    cantaloupe:
      rule: Host(`islandora.io`) && PathPrefix(`/cantaloupe`)
      middlewares:
        - cantaloupe
      service: cantaloupe
