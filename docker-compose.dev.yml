# example docker compose override for local development
# allowing editing custom themes/modules from host machine
services:
  drupal:
    volumes:
      - ./drupal/rootfs/var/www/drupal/assets:/var/www/drupal/assets:z,rw,delegated
      - ./drupal/rootfs/var/www/drupal/composer.json:/var/www/drupal/composer.json:z,rw,delegated
      - ./drupal/rootfs/var/www/drupal/composer.lock:/var/www/drupal/composer.lock:z,rw,delegated
      - ./drupal/rootfs/var/www/drupal/config:/var/www/drupal/config:z,rw,delegated
      - ./drupal/rootfs/var/www/drupal/web/modules/custom:/var/www/drupal/web/modules/custom:z,rw,delegated
      - ./drupal/rootfs/var/www/drupal/web/themes/custom:/var/www/drupal/web/themes/custom:z,rw,delegated
  mariadb:
    ports:
      - "3306:3306"
  traefik:
    command: >-
      --ping=true
      --log.level=INFO
      --entryPoints.http.address=:80
      --entryPoints.http.forwardedHeaders.trustedIPs=127.0.0.1/32,172.0.0.0/8,192.168.0.0/16
      --entryPoints.http.http.encodedCharacters.allowEncodedSlash=true
      --entryPoints.http.http.encodedCharacters.allowEncodedPercent=true
      --entryPoints.http.http.encodedCharacters.allowEncodedQuestionMark=true
      --entryPoints.http.http.encodedCharacters.allowEncodedHash=true
      --entryPoints.http.transport.respondingTimeouts.readTimeout=60
      --providers.file.directory=/etc/traefik/dynamic
      --providers.docker=true
      --providers.docker.network=default
      --providers.docker.exposedByDefault=false
      --api.insecure=false
      --api.dashboard=false
      --api.debug=false
